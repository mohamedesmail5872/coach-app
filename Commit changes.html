<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أنت الكوتش</title>
<style>
:root{--bg:#0b0d0b;--c:#161a16;--b:#2a302a;--g:#7CFF3A;--t:#eef2ee;--m:#8b948b;--r:#ff5d5d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,Tahoma,Arial,sans-serif}
body{padding-bottom:210px}
header{padding:10px 14px;display:flex;gap:8px;align-items:center;background:var(--c);border-bottom:2px solid var(--g)}header b{color:var(--g);font-size:20px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--c)}nav button{white-space:nowrap}nav .on{background:var(--g);color:#000}
main{padding:12px;max-width:900px;margin:auto}
@media(min-width:900px){body{display:grid;grid-template-columns:190px 1fr;padding-bottom:210px}header{grid-column:1/3}nav{flex-direction:column;overflow:visible;align-self:start;position:sticky;top:0}}
button,select,input,textarea{font:inherit;background:#0f120f;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px}
button{cursor:pointer;background:#222822}button.pr{background:var(--g);color:#000;font-weight:700;border:0}button.dg{color:var(--r)}
input:focus,select:focus{outline:2px solid var(--g)}
.cd{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
.rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}.sp{flex:1}.mu{color:var(--m)}
table{width:100%;border-collapse:collapse}th,td{padding:3px;text-align:center}td input{width:100%;min-width:52px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.g div{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;text-align:center}.g b{display:block;font-size:22px;color:var(--g)}
.br{display:flex;gap:8px;align-items:center;margin:5px 0}.br span{width:90px;font-size:13px}.br i{flex:1;height:12px;background:#222;border-radius:6px;overflow:hidden}.br b{display:block;height:100%;background:var(--g)}.br em{width:60px;font-style:normal;font-size:13px}
.vc{display:flex;gap:3px;align-items:flex-end;height:140px;overflow-x:auto}.vc div{flex:0 0 26px;text-align:center;font-size:9px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.vc b{background:var(--g);display:block;border-radius:3px 3px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{padding:10px 0}.cal .t{border-color:var(--g);background:#1e3a12}
label{display:block;margin:6px 0;font-size:14px}label input,label select{display:block;width:100%}
#tm{position:fixed;bottom:0;left:0;right:0;background:#101410;border-top:2px solid var(--g);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
#td{font-size:38px;font-weight:800;color:var(--g);text-align:center;direction:ltr}#tp{height:8px;background:#222;border-radius:4px;overflow:hidden}#tp b{display:block;height:100%;background:var(--g)}
#ts{position:fixed;top:12px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--g);color:#000;z-index:9;display:none}#ts.e{background:var(--r);color:#fff}
.ov{position:fixed;inset:0;background:#000a;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px}
textarea{width:100%;min-height:120px;direction:ltr}h2,h3{color:var(--g)}
</style></head><body>
<header><b>أنت الكوتش</b><span class="sp"></span><span id="ac"></span></header><nav id="nv"></nav><main id="m"></main>
<div id="tm"><div id="td">00:00</div><div id="tp"><b style="width:0"></b></div><div class="rw"><span class="mu">راحة:</span>
<button data-a="ts" data-v="30">30</button><button data-a="ts" data-v="45">45</button><button data-a="ts" data-v="60">60</button><button data-a="ts" data-v="90">90</button><button data-a="ts" data-v="120">120</button><button data-a="ts" data-v="180">180</button>
<input id="tc" type="number" min="1" placeholder="ثانية" style="width:70px"><button data-a="tcu">ابدأ</button><button data-a="tpz">⏯</button><button data-a="trs">إعادة</button><button class="pr" data-a="tnx">المجموعة التالية</button></div></div>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),p=n=>String(n).padStart(2,'0'),fd=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),today=()=>fd(new Date()),pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},wk=s=>{const d=pd(s);d.setDate(d.getDate()-(d.getDay()+1)%7);return fd(d)},f=x=>Math.round(x*10)/10;
const M=['الصدر','الظهر','الكتف','البايسبس','الترايسبس','الأرجل','المؤخرة','البطن','الساعد','الكارديو','الجسم بالكامل'],EQ=['بار','دمبل','جهاز','كابل','وزن الجسم','أخرى'],DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const SYS={ppl:{n:'Push / Pull / Legs',d:['Push','Pull','Legs'],t:'يقسّم الحصص حسب نوع الحركة؛ مناسب لـ 3–6 أيام.'},bro:{n:'Bro Split',d:['صدر','ظهر','كتف','أذرع','أرجل'],t:'عضلة رئيسية لكل يوم؛ مناسب لـ 5 أيام.'},fb:{n:'Full Body',d:['جسم كامل'],t:'كل الجسم في كل حصة؛ مناسب لـ 2–3 أيام.'}};
const NV=[['home','الرئيسية'],['log','بدء تمرين'],['sched','الجدول الأسبوعي'],['sys','أنظمة التدريب'],['lib','مكتبة التمارين'],['hist','سجل التمارين'],['cal','التقويم'],['stats','الإحصائيات'],['pr','الأرقام القياسية'],['goals','الأهداف'],['bk','النسخ الاحتياطي'],['set','الإعدادات']];
const def=()=>({set:{coach:'أنت الكوتش',level:'',goal:'',days:3,rest:90,sound:1,sys:''},sched:Array(7).fill(''),lib:[],ses:[],draft:null,timer:null,goals:{days:0,sets:0,reps:0,vol:0}});
let S,db,page=location.hash.slice(1)||'home',calm=today().slice(0,7),calsel='',le=-1,CF=null,busy=0,bk='',H={q:'',m:'',st:'',sys:'',d:''},ST={per:'30',from:'',to:'',g:'w',fx:'',fm:'',sx:''},ex={},st;
const R={set:()=>S.set,goals:()=>S.goals,H:()=>H,ST:()=>ST};
const idb=()=>new Promise((a,b)=>{const r=indexedDB.open('antaelcoach',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
const load=async()=>{try{db=await idb();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}};
const flush=()=>{try{db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){toast('تعذر الحفظ الدائم في هذا المتصفح',1)}};
const save=()=>{clearTimeout(st);st=setTimeout(flush,250)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
function toast(m,e){const t=$('#ts');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const ask=(m,fn)=>{CF={m,fn};render()};
// calculations
const done=()=>S.ses.filter(s=>s.st=='done'),ev=e=>e.m=='الكارديو'?0:e.sets.reduce((a,x)=>a+(x.done?(+x.w||0)*(+x.r||0):0),0);
const agg=l=>{const o={n:0,sets:0,reps:0,vol:0,dur:0,days:new Set(),ex:0};l.forEach(s=>{o.n++;o.days.add(s.date);o.dur+=s.dur||0;o.ex+=s.exs.length;s.exs.forEach(e=>{e.sets.forEach(x=>{if(x.done){o.sets++;o.reps+=+x.r||0}});o.vol+=ev(e)})});return o};
const best=k=>{const g={};done().forEach(s=>{(g[k(s)]??=[]).push(s)});return Object.entries(g).map(([k,l])=>({k,...agg(l)})).sort((a,b)=>b.sets-a.sets||b.vol-a.vol)};
const inP=s=>{if(ST.per=='all')return 1;if(ST.per=='c')return(!ST.from||s.date>=ST.from)&&(!ST.to||s.date<=ST.to);const c=new Date();c.setDate(c.getDate()-ST.per);return s.date>fd(c)};
const last=n=>{const l=done().filter(s=>s.exs.some(e=>e.n==n)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)[0];return l?{date:l.date,sets:l.exs.find(e=>e.n==n).sets.filter(x=>x.done)}:null};
const prs=()=>{const o={};done().forEach(s=>s.exs.forEach(e=>{const r=o[e.n]??={m:e.m,hw:null,orm:null,rw:{},vol:null};e.sets.forEach(x=>{if(!x.done)return;const w=+x.w||0,rp=+x.r||0;if(!r.hw||w>r.hw.v)r.hw={v:w,r:rp,d:s.date};if(w>0&&rp&&rp<=12){const q=w*(1+rp/30);if(!r.orm||q>r.orm.v)r.orm={v:q,d:s.date}}if(!r.rw[w]||rp>r.rw[w].v)r.rw[w]={v:rp,d:s.date}});const v=ev(e);if(v&&(!r.vol||v>r.vol.v))r.vol={v,d:s.date}}));return o};
const ser=n=>{const m={};done().forEach(s=>s.exs.forEach(e=>{if(e.n!=n)return;e.sets.forEach(x=>{if(x.done){const o=m[s.date]??={w:-1,r:0};if(+x.w>o.w||(+x.w==o.w&&+x.r>o.r)){o.w=+x.w||0;o.r=+x.r||0}}})}));return Object.entries(m).sort().map(([d,o])=>({d,...o}))};
const streaks=ds=>{const u=[...new Set(ds)].sort();let L=0,c=0,pv=null;u.forEach(d=>{c=pv&&Math.round((pd(d)-pd(pv))/864e5)==1?c+1:1;L=Math.max(L,c);pv=d});const t=today(),y=fd(new Date(Date.now()-864e5));let cur=0;if(u.includes(t)||u.includes(y)){cur=1;let d=pd(u.includes(t)?t:y);for(;;){d.setDate(d.getDate()-1);if(u.includes(fd(d)))cur++;else break}}return{L,cur,n:u.length}};
// ui helpers
const grid=a=>`<div class="g"><div><b>${a.days.size}</b>أيام</div><div><b>${a.n}</b>حصص</div><div><b>${a.sets}</b>مجموعات</div><div><b>${a.reps}</b>تكرارات</div><div><b>${f(a.vol)}</b>حجم (كجم)</div></div>`;
const bar=(l,v,mx,u='')=>`<div class="br"><span>${E(l)}</span><i><b style="width:${mx?v/mx*100:0}%"></b></i><em>${f(v)}${u}</em></div>`;
const sysO=v=>'<option value="">—</option>'+Object.entries(SYS).map(([k,s])=>`<option value="${k}" ${v==k?'selected':''}>${s.n}</option>`).join('');
const mO=(v,all)=>(all?'<option value="">الكل</option>':'')+M.map(m=>`<option ${v==m?'selected':''}>${m}</option>`).join('');
const eO=(v,all)=>(all?'<option value="">الكل</option>':'')+EQ.map(m=>`<option ${v==m?'selected':''}>${m}</option>`).join('');
const inp=(o,k,l,t='text',v)=>`<label>${l}<input type="${t}" ${t=='number'?'min="0" step="any"':''} data-o="${o}" data-p="${k}" value="${E(v??R[o]()[k])}"></label>`;
const dlist=l=>l.length?l.map(s=>{const a=agg([s]);return`<div class="cd"><b>${E(s.name||'حصة')}</b> <span class="mu">${s.date} · ${SYS[s.sys]?.n||''} · ${s.st=='done'?'مكتملة':'مسودة'} · ${s.dur||0} دقيقة</span>${grid(a)}${s.exs.map(e=>`<p><b>${E(e.n)}</b> <span class="mu">${E(e.m)}</span><br>${e.sets.map((x,i)=>`${i+1}) ${x.w||0}×${x.r||0}${x.rpe!==''&&x.rpe!=null?' RPE'+x.rpe:''} ${x.done?'✓':'✗'}`).join(' &nbsp; ')}</p>`).join('')}${s.notes?`<p>📝 ${E(s.notes)}</p>`:''}<div class="rw"><button data-a="edit" data-v="${s.id}">تعديل</button><button data-a="dup" data-v="${s.id}">تكرار</button><button class="dg" data-a="del" data-v="${s.id}">حذف</button></div></div>`}).join(''):'<p class="mu">لا توجد حصص.</p>';
const tot=d=>{const a=agg([{...d,dur:d.eid?d.dur:Math.max(0,Math.round((Date.now()-d.start)/6e4))}]),pp=prs();let n=0;d.exs.forEach(e=>{const w=Math.max(0,...e.sets.filter(x=>x.done).map(x=>+x.w||0));if(w&&pp[e.n]?.hw&&w>pp[e.n].hw.v)n++});return`المنجز فقط — مجموعات: <b>${a.sets}</b> · تكرارات: <b>${a.reps}</b> · حجم: <b>${f(a.vol)}</b> كجم · تمارين: <b>${a.ex}</b> · مدة: <b>${a.dur}</b> د · أرقام قياسية جديدة: <b>${n}</b>`};
function exH(e,i){const l=last(e.n);return`<div class="cd"><div class="rw"><b>${E(e.n)}</b><span class="mu">${E(e.m)}</span><span class="sp"></span><button data-a="up" data-e="${i}">▲</button><button data-a="dn" data-e="${i}">▼</button><button class="dg" data-a="delex" data-e="${i}">حذف</button></div>${l?`<div class="mu">آخر مرة (${l.date}): ${l.sets.map(x=>x.w+'×'+x.r).join(' ، ')}</div>`:''}<table><tr><th>#<th>الوزن كجم<th>التكرارات<th>RPE<th>تم<th></tr>${e.sets.map((x,j)=>{const a=`data-e="${i}" data-s="${j}"`;return`<tr><td>${j+1}<td><input type="number" inputmode="decimal" min="0" step="any" ${a} data-k="w" value="${E(x.w)}"><td><input type="number" inputmode="numeric" min="0" ${a} data-k="r" value="${E(x.r)}"><td><input type="number" min="0" max="10" step="0.5" ${a} data-k="rpe" value="${E(x.rpe)}"><td><input type="checkbox" ${a} data-k="done" ${x.done?'checked':''}><td><button class="dg" data-a="delset" ${a}>✕</button></tr>`}).join('')}</table><div class="rw"><button data-a="addset" data-e="${i}">+ مجموعة</button><button data-a="fill" data-e="${i}" ${l?'':'disabled'}>تكرار آخر أداء</button></div></div>`}
// pages
const P={
home(){const w=wk(today()),a=agg(done().filter(s=>wk(s.date)==w)),t=S.sched[(new Date().getDay()+1)%7],rc=done().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);return`<h2>مرحبًا، ${E(S.set.coach)}</h2><div class="cd">${S.draft?`حصة نشطة: <b>${E(S.draft.name||'بدون اسم')}</b> <button class="pr" data-a="go" data-v="log">متابعة</button>`:`جدول اليوم: <b>${t?E(t):'راحة / غير محدد'}</b> <button class="pr" data-a="go" data-v="log">بدء تمرين</button>`}</div><h3>هذا الأسبوع (سبت–جمعة)</h3>${grid(a)}<h3>آخر الحصص</h3>${rc.length?dlist(rc):'<p class="mu">لا توجد سجلات بعد. أول حصة تحفظها ستظهر هنا.</p>'}`},
log(){const d=S.draft;if(!d)return`<h2>بدء تمرين</h2><div class="cd"><label>التاريخ<input type="date" id="nd" value="${today()}"></label><label>نظام التدريب<select id="ns">${sysO(S.set.sys)}</select></label><label>اسم الحصة<input id="nn" placeholder="مثال: صدر + بايسبس" value="${E(S.sched[(new Date().getDay()+1)%7])}"></label><div class="rw"><button class="pr" data-a="newd">ابدأ حصة فارغة</button><button data-a="copyl">نسخ آخر حصة</button></div></div>`;
return`<h2>${d.eid?'تعديل حصة':'الحصة الحالية'}</h2><div class="cd"><div class="rw"><input type="date" data-d="date" value="${d.date}"><input data-d="name" placeholder="اسم الحصة" value="${E(d.name)}"><select data-d="sys">${sysO(d.sys)}</select></div></div>${d.exs.length?d.exs.map(exH).join(''):'<p class="mu">الحصة فارغة. أضف تمارينك بنفسك بالأسفل.</p>'}<div class="cd"><b>إضافة تمرين</b><div class="rw"><input id="an" list="lb" placeholder="اكتب اسم التمرين"><datalist id="lb">${S.lib.map(x=>`<option value="${E(x.n)}">`).join('')}</datalist><select id="am">${mO()}</select><button class="pr" data-a="addex">إضافة</button></div></div><div class="cd"><textarea data-d="notes" placeholder="ملاحظات (اختياري)" style="direction:rtl">${E(d.notes)}</textarea></div><div class="cd" id="tot">${tot(d)}</div><div class="rw"><button class="pr" data-a="fin">إنهاء وحفظ</button><button data-a="go" data-v="home">الخروج (المسودة محفوظة)</button><button class="dg" data-a="canc">إلغاء الحصة</button></div>`},
sched(){return`<h2>الجدول الأسبوعي</h2><p class="mu">الجدول يتكرر تلقائيًا كل أسبوع. اكتب اسم الحصة ليوم التدريب واتركه فارغًا ليوم الراحة. لا يُسجَّل شيء في السجل إلا بعد حفظ حصة فعلية.</p><div class="cd">${DAYS.map((d,i)=>`<label>${d}<input data-sc="${i}" placeholder="راحة" value="${E(S.sched[i])}"></label>`).join('')}</div>`},

apply(k){S.set.sys=k;const n=Math.min(7,Math.max(1,+S.set.days||3)),ps={1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,3,4],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]}[n],d=SYS[k].d;S.sched=Array(7).fill('');ps.forEach((q,i)=>S.sched[q]=d[i%d.length]);save();toast('تم تطبيق النظام على الجدول');A.go('sched')},
lsave(){const n=$('#ln').value.trim();if(!n)return toast('اكتب اسم التمرين',1);const r=$('#lr').value;if(r!==''&&!(+r>=0))return toast('مدة راحة غير صالحة',1);const o={n,m:$('#lm').value,en:$('#len').value,s:$('#ls').value,e:$('#le').value,r:r===''?'':+r,i:$('#li').value,u:$('#lu').value.trim(),t:$('#lt').value};if(o.u&&!/^https?:\/\//.test(o.u))return toast('الرابط يجب أن يبدأ بـ http',1);if(le>=0)S.lib[le]=o;else S.lib.push(o);le=-1;save();toast('تم الحفظ');render()},
lcan(){le=-1;render()},ledit(v){le=+v;render();scrollTo(0,0)},ldel(v){ask('حذف التمرين من المكتبة؟',()=>{S.lib.splice(+v,1);le=-1;save()})},
ladd(v){const L=S.lib[+v];if(!S.draft)return toast('ابدأ حصة أولًا',1);S.draft.exs.push({n:L.n,m:L.m,sets:[{w:'',r:'',rpe:'',done:0}]});save();toast('أُضيف إلى الحصة')},
ejson(){bk=JSON.stringify(S,null,1);render();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bk],{type:'application/json'}));a.download='anta-el-coach-backup.json';a.click()}catch(e){}toast('النسخة جاهزة في المربع')},
ecsv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',r=[['date','session','system','status','exercise','muscle','set','weight','reps','rpe','done']];S.ses.forEach(s=>s.exs.forEach(e=>e.sets.forEach((x,i)=>r.push([s.date,s.name,s.sys,s.st,e.n,e.m,i+1,x.w,x.r,x.rpe,x.done?1:0]))));bk=r.map(a=>a.map(q).join(',')).join('\n');render();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+bk],{type:'text/csv'}));a.download='workouts.csv';a.click()}catch(e){}toast('تم إنشاء CSV')},
imp(){doImp($('#bx').value)},
cap(){S.set.coach='كابتن محمد';save();render()},cdef(){S.set.coach='أنت الكوتش';save();render()},
wipe(){ask('حذف جميع بياناتك نهائيًا؟ لا يمكن التراجع.',()=>{S=def();save()})}};
function doImp(t){let o;try{o=JSON.parse(t)}catch(e){return toast('النص ليس JSON صالحًا',1)}const ok=v=>v===''||v==null||(isFinite(+v)&&+v>=0);if(!o||!Array.isArray(o.ses)||!Array.isArray(o.lib)||typeof o.set!='object'||!o.ses.every(s=>s&&/^\d{4}-\d\d-\d\d$/.test(s.date)&&(s.st=='done'||s.st=='draft')&&Array.isArray(s.exs)&&s.exs.every(e=>e&&typeof e.n=='string'&&Array.isArray(e.sets)&&e.sets.every(x=>x&&ok(x.w)&&ok(x.r)&&ok(x.rpe))))||!o.lib.every(x=>x&&typeof x.n=='string'))return toast('ملف النسخة غير صالح ولم يُطبَّق',1);ask(`استعادة ${o.ses.length} حصة و${o.lib.length} تمرين؟ سيتم استبدال البيانات الحالية.`,()=>{S={...def(),...o,set:{...def().set,...o.set}};save();toast('تمت الاستعادة ✓')})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)A[t.dataset.a]?.(t.dataset.v,+t.dataset.e,+t.dataset.s)});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(d.k!=null&&t.type!='checkbox'&&S.draft){S.draft.exs[+d.e].sets[+d.s][d.k]=t.value;upd()}else if(d.d!=null&&S.draft){S.draft[d.d]=t.value;upd()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.k=='done'){S.draft.exs[+d.e].sets[+d.s].done=t.checked?1:0;if(t.checked)tstart(S.set.rest);save();render()}else if(d.sc!=null){S.sched[+d.sc]=t.value;save()}else if(d.o){let v=t.value;if(t.type=='number'){if(v!==''&&!(+v>=0))return toast('أدخل رقمًا غير سالب',1);v=v===''?0:+v}if(d.o=='set'&&d.p=='sound')v=+v;R[d.o]()[d.p]=v;save();render()}else if(d.x){ex[d.x]=t.value;render()}else if(t.id=='fl'&&t.files[0]){const r=new FileReader();r.onload=()=>doImp(r.result);r.readAsText(t.files[0])}else if(d.d=='date'){render()}});
(async()=>{const o=await load();S=o?{...def(),...o,set:{...def().set,...o.set},goals:{...def().goals,...o.goals}}:def();if(!db)toast('التخزين الدائم غير متاح في هذا المتصفح',1);render();setInterval(tick,250);tick()})();
